# =============================================================================
# RegimeX — Local Development Stack
# infra/docker-compose.yml
# =============================================================================
#
# Provides the complete local development topology for RegimeX.
# This file is for LOCAL DEVELOPMENT ONLY — not for production.
#
# Usage:
#   Build and start all services:  docker compose up --build -d
#   Start all services:            docker compose up -d
#   Stop all services:             docker compose down
#   View logs:                     docker compose logs -f
#   View single service logs:      docker compose logs -f api
#   Reset all persistent data:     docker compose down -v  (DESTROYS volumes)
#   Run migrations:                docker compose exec api alembic upgrade head
#
# Architecture:
#   - All internal services communicate on the regimex_net private network.
#   - Database and Redis ports are bound to loopback (127.0.0.1) only —
#     they are NOT exposed to other machines on the network.
#   - API and web ports are also loopback-bound for local development safety.
#
# Environment:
#   Copy apps/api/.env.example → apps/api/.env and populate values before
#   starting the stack.  The api service reads apps/api/.env via env_file.
#
# =============================================================================

name: regimex

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL + TimescaleDB
  # Primary time-series and relational data store.
  # ---------------------------------------------------------------------------
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: regimex-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: regimex_dev
      POSTGRES_USER: regimex
      # Supply a real password via .env or shell environment.
      # Never commit real credentials to version control.
      POSTGRES_PASSWORD: ${REGIMEX_DB_PASSWORD:-changeme_dev_only}
    ports:
      # Bound to loopback — accessible on this machine only.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - regimex_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regimex -d regimex_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis 7
  # In-memory cache, Celery message broker, and rate-limiting backend.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: regimex-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - regimex_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # RegimeX API (FastAPI / Uvicorn)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    container_name: regimex-api
    restart: unless-stopped
    # Load the api .env file first; explicit environment entries override it.
    # Copy apps/api/.env.example → apps/api/.env before first run.
    env_file:
      - path: ../apps/api/.env
        required: false
    environment:
      REGIMEX_ENV: development
      # Override the localhost URLs in .env with internal service hostnames.
      REGIMEX_DATABASE_URL: postgresql+asyncpg://regimex:${REGIMEX_DB_PASSWORD:-changeme_dev_only}@db:5432/regimex_dev
      REGIMEX_REDIS_URL: redis://redis:6379/0
      REGIMEX_CELERY_BROKER_URL: redis://redis:6379/1
      REGIMEX_CELERY_RESULT_BACKEND: redis://redis:6379/2
      # Keep AI provider as mock by default so no external key is needed.
      REGIMEX_AI_PROVIDER: mock
      PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        # Wait for PostgreSQL to pass its health check before starting the API.
        # depends_on alone is not sufficient — condition: service_healthy ensures
        # the database is actually ready to accept connections.
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - regimex_net
    healthcheck:
      # GET /health — liveness probe; does not touch the database.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # RegimeX Web (Next.js)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    container_name: regimex-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      # NEXT_PUBLIC_API_URL is the URL the browser uses to reach the API.
      # In local development the browser hits localhost:8000 directly.
      # In production, replace with your public API domain.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        # Wait for the API to be healthy before accepting web traffic.
        condition: service_healthy
    networks:
      - regimex_net
    healthcheck:
      # Lightweight liveness check against the application root.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:3000/', (r) => { process.exit(r.statusCode < 500 ? 0 : 1) }).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# =============================================================================
# Networks
# =============================================================================
networks:
  regimex_net:
    driver: bridge
    name: regimex_net

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
