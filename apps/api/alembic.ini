# =============================================================================
# RegimeX API — Alembic Database Migration Configuration
# =============================================================================

[alembic]
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Prepend sys.path with the api application root
prepend_sys_path = .
path_separator = os

# Timezone for revision timestamps (UTC)
timezone = UTC

# Truncate slug length
truncate_slug_length = 40

# Version locations
version_locations = %(here)s/alembic/versions

# Output encoding
output_encoding = utf-8

# =============================================================================
# Logging configuration
# =============================================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
