name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  security:
    name: Security & Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for forbidden credentials and secret files
        run: |
          echo "Scanning for forbidden credential files..."
          FORBIDDEN=$(find . -maxdepth 4 \( -name ".env" -o -name ".env.production" -o -name "*.pem" -o -name "*.key" -o -name "id_rsa*" \) ! -path "*/.git/*" ! -name ".env.example" ! -name ".env.production.example")
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Found forbidden credential/env files in repository:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "No forbidden credential files found."

      - name: Verify example env files contain no live secrets
        run: |
          echo "Verifying placeholder safety in .env.example files..."
          for f in $(find . -maxdepth 3 \( -name ".env.example" -o -name ".env.production.example" \)); do
            echo "Checking $f..."
            if grep -Ei "sk-[a-zA-Z0-9]{20,}" "$f" 2>/dev/null; then
              echo "::error::Possible live API key found in $f"
              exit 1
            fi
          done
          echo "All example files contain safe placeholders."

  infra:
    name: Infrastructure Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Docker Compose development configuration
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Validate Docker Compose production configuration
        env:
          REGIMEX_DB_PASSWORD: ci-validation-database-password
          REGIMEX_DATABASE_URL: postgresql+asyncpg://regimex:ci-validation-database-password@db:5432/regimex_prod
          REGIMEX_SECRET_KEY: ci-validation-secret-key-minimum-32-chars-long-000000
          REGIMEX_ALLOWED_ORIGINS: http://localhost:3000,https://regimex.example.com
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml config --quiet

  backend:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    env:
      REGIMEX_ENV: test
      SECRET_KEY: ci-test-secret-key-for-unit-and-integration-testing-000
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "apps/api/pyproject.toml"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,database,workers,analytics,ml,observability]"

      - name: Check Ruff formatting
        run: python -m ruff format --check app tests

      - name: Check Ruff linting
        run: python -m ruff check app tests

      - name: Run Mypy strict type check
        run: python -m mypy app tests

      - name: Run Pytest test suite
        run: python -m pytest tests/ -q --tb=short

  frontend:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@1e60f63fe749454848bbdc089d892d19f6a7d519 # v4.2.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run frontend unit tests
        run: npm test

      - name: Build Next.js production bundle
        run: npm run build

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514310bc82956671457a546cac9caac5f416 # v3.10.0

      - name: Build API Docker image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          tags: regimex-api:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Docker image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          tags: regimex-web:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-gate:
    name: CI Gate
    needs: [security, infra, backend, frontend, docker-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required checks passed
        run: |
          echo "Evaluating CI Gate check results:"
          echo "  Security & Hygiene:        ${{ needs.security.result }}"
          echo "  Infrastructure Validation: ${{ needs.infra.result }}"
          echo "  Backend Quality & Tests:   ${{ needs.backend.result }}"
          echo "  Frontend Quality & Tests:  ${{ needs.frontend.result }}"
          echo "  Docker Build Verification: ${{ needs.docker-build.result }}"

          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "::error::Security & Hygiene job failed or was skipped (${{ needs.security.result }})"
            exit 1
          fi
          if [ "${{ needs.infra.result }}" != "success" ]; then
            echo "::error::Infrastructure Validation job failed or was skipped (${{ needs.infra.result }})"
            exit 1
          fi
          if [ "${{ needs.backend.result }}" != "success" ]; then
            echo "::error::Backend Quality & Tests job failed or was skipped (${{ needs.backend.result }})"
            exit 1
          fi
          if [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "::error::Frontend Quality & Tests job failed or was skipped (${{ needs.frontend.result }})"
            exit 1
          fi
          if [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "::error::Docker Build Verification job failed or was skipped (${{ needs.docker-build.result }})"
            exit 1
          fi

          echo "✅ All continuous integration checks passed successfully."
